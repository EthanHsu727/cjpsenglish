<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>極簡大字助手 - iOS Assistive UI</title>
  <style>
    :root {
      --bg-black: #000000;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-bg-active: rgba(255, 255, 255, 0.16);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-yellow: #FFD60A;
      --accent-orange: #FF9F0A;
      --accent-red: #FF453A;
      --accent-green: #30D158;
      --accent-blue: #0A84FF;
      --text-main: #FFFFFF;
      --text-sub: #A1A1A6;
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-black);
      color: var(--text-main);
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      left: 0;
      top: 0;
    }

    body {
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    #brightness-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 10px;
      box-sizing: border-box;
      overscroll-behavior: none;
      overflow: hidden;
    }

    .active-page { display: flex; }

    #page-home { touch-action: none; }

    .back-btn {
      background: linear-gradient(135deg, #FF9F0A 0%, #FF5E00 100%);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      margin-top: auto;
      flex-shrink: 0;
      touch-action: manipulation;
      box-shadow: 0 8px 24px rgba(255, 159, 10, 0.35);
    }

    .back-btn:active { transform: scale(0.97); filter: brightness(0.9); }

    .home-clock-box {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: clamp(6px, 1.5vh, 14px) 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .clock-date { font-size: clamp(14px, 2vh, 18px); color: var(--text-sub); font-weight: 600; }

    .clock-time {
      font-size: clamp(34px, 5.5vh, 46px);
      color: var(--accent-yellow);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 214, 10, 0.3);
    }

    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .app-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1vh, 8px);
      cursor: pointer;
      touch-action: manipulation;
      min-height: 0;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    .app-card:active { background: var(--card-bg-active); transform: scale(0.95); }

    .icon-box {
      width: clamp(42px, 6.5vh, 58px);
      height: clamp(42px, 6.5vh, 58px);
      border-radius: 22%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .icon-svg {
      width: 55%; height: 55%; fill: none; stroke: #FFFFFF;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    .icon-settings { background: linear-gradient(135deg, #8E8E93 0%, #3A3A3C 100%); }
    .icon-camera   { background: linear-gradient(135deg, #48484A 0%, #1C1C1E 100%); }
    .icon-photos   { background: linear-gradient(135deg, #FF3B30 0%, #FF9500 30%, #34C759 70%, #007AFF 100%); }
    .icon-audio    { background: linear-gradient(135deg, #FF2D55 0%, #FF3B30 100%); }
    .icon-stock    { background: linear-gradient(135deg, #30D158 0%, #128031 100%); }
    .icon-calc     { background: linear-gradient(135deg, #FF9F0A 0%, #D67E00 100%); }

    .app-name { font-size: clamp(15px, 2.2vh, 19px); font-weight: 700; color: var(--text-main); letter-spacing: 0.5px; line-height: 1.1; }

    .setting-item {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }

    .setting-label { font-size: 22px; color: var(--accent-yellow); font-weight: 700; }
    input[type=range] { width: 100%; height: 36px; accent-color: var(--accent-yellow); }

    #camera-preview {
      width: 100%; flex: 1; min-height: 0; background-color: #1C1C1E;
      border-radius: var(--radius-lg); object-fit: cover; border: 1px solid var(--card-border);
    }

    .cam-btn {
      background: linear-gradient(135deg, #30D158 0%, #24A143 100%); color: #000;
      font-size: 24px; font-weight: 800; padding: 16px; border-radius: var(--radius-md);
      border: none; width: 100%; cursor: pointer; flex-shrink: 0;
    }

    .cam-btn-recording { background: linear-gradient(135deg, #FF453A 0%, #D70015 100%) !important; color: #FFF !important; }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
    .photo-item { width: 100%; aspect-ratio: 1 / 1; background-color: #1C1C1E; border-radius: var(--radius-md); object-fit: cover; border: 1px solid var(--card-border); }

    .audio-list { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
    .audio-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .audio-card-top { display: flex; justify-content: space-between; align-items: center; }
    .audio-date { font-size: 17px; color: var(--accent-yellow); font-weight: 700; }
    audio { width: 100%; height: 40px; border-radius: 10px; }

    .stock-search-box { display: flex; gap: 8px; flex-shrink: 0; width: 100%; }
    .stock-input {
      flex: 1; min-width: 0; background-color: #1C1C1E; border: 2px solid var(--accent-yellow);
      border-radius: var(--radius-md); padding: 10px 14px; font-size: 22px; color: #FFF;
      font-weight: 800; outline: none; text-align: center; letter-spacing: 2px;
    }

    .stock-search-btn {
      flex-shrink: 0; background-color: var(--accent-yellow); color: #000; border: none;
      border-radius: var(--radius-md); padding: 0 16px; font-size: 18px; font-weight: 800; cursor: pointer;
    }

    .stock-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .keypad-btn {
      background-color: #2C2C2E; color: #FFFFFF; font-size: 22px; font-weight: 800;
      border-radius: var(--radius-sm); border: 1px solid var(--card-border); padding: 8px 0;
      cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center;
    }
    .keypad-btn:active { background-color: var(--card-bg-active); transform: scale(0.95); }
    .keypad-func { background-color: #3A3A3C; color: var(--accent-yellow); }

    .stock-list { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
    .stock-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);
      padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .stock-card-name { font-size: 20px; font-weight: 800; color: #FFF; }
    .stock-card-code { font-size: 15px; color: var(--text-sub); font-weight: 600; }
    .stock-card-price { font-size: 22px; font-weight: 800; text-align: right; }
    .stock-card-change { font-size: 16px; font-weight: 700; text-align: right; }

    .stock-delete-btn {
      background-color: var(--accent-red); color: #FFF; border: none;
      border-radius: var(--radius-sm); padding: 8px 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }

    .stock-detail-container { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; }
    .stock-header-info { background: var(--card-bg); border-radius: var(--radius-md); padding: 14px; text-align: center; border: 1px solid var(--card-border); flex-shrink: 0; }
    .stock-detail-title { font-size: 24px; font-weight: 800; color: var(--accent-yellow); }
    .stock-detail-price { font-size: 38px; font-weight: 900; margin: 2px 0; }

    .data-grid-single { display: flex; flex-direction: column; gap: 8px; }
    .data-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px; text-align: center; border: 1px solid var(--card-border); }
    .data-label { font-size: 18px; color: var(--text-sub); font-weight: 700; }
    .data-value { font-size: 26px; font-weight: 800; margin-top: 2px; }

    .chart-container {
      background: var(--card-bg); border-radius: var(--radius-md); height: 180px; padding: 10px;
      flex-shrink: 0; position: relative; overflow: hidden; border: 1px solid var(--card-border);
      transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .chart-container.enlarged { height: 300px; }
    #stockCanvas { width: 100%; height: 100%; display: block; }

    .chart-tab-group { display: flex; gap: 8px; flex-shrink: 0; }
    .chart-tab { flex: 1; background-color: #2C2C2E; color: #FFF; border: none; padding: 10px; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; cursor: pointer; }
    .chart-tab.active { background-color: var(--accent-yellow); color: #000; }

    .chart-zoom-btn { background-color: var(--accent-blue); color: #FFFFFF; border: none; border-radius: var(--radius-md); padding: 12px; font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; flex-shrink: 0; }

    .calc-display {
      background: var(--card-bg); border: 2px solid var(--accent-yellow); border-radius: var(--radius-md);
      padding: 14px; font-size: 40px; font-weight: 800; text-align: right; color: var(--accent-yellow);
      height: 80px; display: flex; align-items: center; justify-content: flex-end; overflow-x: auto; flex-shrink: 0;
    }

    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; min-height: 0; }
    .calc-btn { background-color: #2C2C2E; color: #FFF; font-size: 28px; font-weight: 800; border-radius: var(--radius-md); border: none; display: flex; align-items: center; justify-content: center; }
    .calc-btn:active { transform: scale(0.94); opacity: 0.9; }
    .calc-op { background-color: var(--accent-orange); color: #FFF; }
    .calc-clear { background-color: var(--accent-red); color: #FFF; }
    .calc-eq { background-color: var(--accent-green); color: #000; }

    .up { color: var(--accent-red); }
    .down { color: var(--accent-green); }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      background-color: rgba(0, 0, 0, 0.88); backdrop-filter: blur(25px); z-index: 1000;
      flex-direction: column; justify-content: center; align-items: center; padding: 12px;
      box-sizing: border-box; overflow: hidden;
    }

    .modal-content { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; height: 100%; min-height: 0; overflow: hidden; }
    .zoom-container { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background-color: #1C1C1E; border-radius: var(--radius-lg); border: 1px solid var(--card-border); touch-action: none; position: relative; }
    #media-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; transform-origin: center center; }
    #enlarged-media-container { max-width: 100%; max-height: 100%; pointer-events: none; }

    .modal-btn-group { display: flex; gap: 8px; width: 100%; flex-shrink: 0; }
    .action-btn { flex: 1; padding: 14px 6px; font-size: 18px; font-weight: 800; border-radius: var(--radius-md); border: none; color: #FFF; cursor: pointer; }
    .zoom-btn { background-color: var(--accent-blue); }
    .delete-btn { background-color: var(--accent-red); }

    .confirm-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 24px 18px; text-align: center; width: 95%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
    .confirm-title { font-size: 24px; color: #FFF; font-weight: 800; }
    .confirm-btn-group { display: flex; gap: 10px; }
    .confirm-btn { flex: 1; padding: 14px; font-size: 20px; font-weight: 800; border-radius: var(--radius-md); border: none; cursor: pointer; }
    .yes-btn { background-color: var(--accent-green); color: #000; }
    .no-btn { background-color: #3A3A3C; color: #FFF; }

    .custom-select { font-size: 20px; padding: 12px; border-radius: var(--radius-md); background-color: #1C1C1E; color: var(--accent-yellow); border: 2px solid var(--accent-yellow); width: 100%; text-align: center; font-weight: 700; outline: none; }
  </style>
</head>
<body>

  <div id="brightness-overlay"></div>

  <div id="page-home" class="page active-page">
    <div class="home-clock-box">
      <div id="clock-date" class="clock-date">----年--月--日 星期-</div>
      <div id="clock-time" class="clock-time">00:00:00</div>
    </div>

    <div class="app-grid">
      <div class="app-card" onclick="navTo('page-settings')">
        <div class="icon-box icon-settings">
          <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <div class="app-name">設定</div>
      </div>

      <div class="app-card" onclick="openCameraConfig()">
        <div class="icon-box icon-camera">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>
        <div class="app-name">相機</div>
      </div>

      <div class="app-card" onclick="navTo('page-photos')">
        <div class="icon-box icon-photos">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </div>
        <div class="app-name">照片</div>
      </div>

      <div class="app-card" onclick="navTo('page-audio')">
        <div class="icon-box icon-audio">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </div>
        <div class="app-name">錄音</div>
      </div>

      <div class="app-card" onclick="navTo('page-stock')">
        <div class="icon-box icon-stock">
          <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        </div>
        <div class="app-name">股票</div>
      </div>

      <div class="app-card" onclick="navTo('page-calc')">
        <div class="icon-box icon-calc">
          <svg class="icon-svg" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 14h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path></svg>
        </div>
        <div class="app-name">計算機</div>
      </div>
    </div>
  </div>

  <div id="page-settings" class="page">
    <div class="setting-item">
      <div class="setting-label">螢幕亮度</div>
      <input type="range" id="brightness-slider" min="0" max="80" value="0" oninput="adjustBrightness(this.value)">
    </div>
    <div class="setting-item">
      <div class="setting-label">提示音量</div>
      <input type="range" min="0" max="100" value="80" onchange="playBeep()">
    </div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-camera" class="page">
    <video id="camera-preview" autoplay playsinline></video>
    <button id="cam-action-btn" class="cam-btn" onclick="handleCameraAction()">拍照</button>
    <button class="back-btn" onclick="stopCamera(); navTo('page-home');">返回首頁</button>
  </div>

  <div id="page-photos" class="page">
    <div id="photo-list" class="photo-grid"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-audio" class="page">
    <button id="audio-rec-btn" class="cam-btn" style="background: linear-gradient(135deg, #FF9F0A 0%, #D67E00 100%); color: #FFF;" onclick="toggleAudioRecord()">🎙️ 開始錄音</button>
    <div id="audio-list" class="audio-list"></div>
    <button class="back-btn" onclick="stopAudioStream(); navTo('page-home');">返回首頁</button>
  </div>

  <div id="page-stock" class="page">
    <div class="stock-search-box">
      <input type="text" id="stock-input" class="stock-input" placeholder="按下方數字鍵" readonly inputmode="none">
      <button id="stock-add-btn" class="stock-search-btn" onclick="addStock()">➕ 新增</button>
    </div>

    <div class="stock-keypad">
      <button class="keypad-btn" onclick="keypadInput('1')">1</button>
      <button class="keypad-btn" onclick="keypadInput('2')">2</button>
      <button class="keypad-btn" onclick="keypadInput('3')">3</button>
      <button class="keypad-btn" onclick="keypadInput('4')">4</button>
      <button class="keypad-btn" onclick="keypadInput('5')">5</button>
      <button class="keypad-btn" onclick="keypadInput('6')">6</button>
      <button class="keypad-btn" onclick="keypadInput('7')">7</button>
      <button class="keypad-btn" onclick="keypadInput('8')">8</button>
      <button class="keypad-btn" onclick="keypadInput('9')">9</button>
      <button class="keypad-btn keypad-func" onclick="keypadClear()">C</button>
      <button class="keypad-btn" onclick="keypadInput('0')">0</button>
      <button class="keypad-btn keypad-func" onclick="keypadBackspace()">⌫</button>
    </div>

    <div class="stock-list" id="stock-list-container"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-stock-detail" class="page">
    <div class="stock-detail-container">
      <div class="stock-header-info">
        <div id="sd-title" class="stock-detail-title">--</div>
        <div id="sd-price" class="stock-detail-price">--</div>
        <div id="sd-change" style="font-size: 22px; font-weight: 800;">--</div>
      </div>

      <div class="chart-tab-group">
        <button class="chart-tab active" onclick="switchChartTab(this, 'line')">折線圖</button>
        <button class="chart-tab" onclick="switchChartTab(this, 'kline')">K線圖</button>
      </div>

      <div class="chart-container" id="chart-container-box">
        <canvas id="stockCanvas"></canvas>
      </div>

      <button id="chart-zoom-btn" class="chart-zoom-btn" onclick="toggleChartZoom()">🔍 放大圖表與數值</button>

      <div class="data-grid-single">
        <div class="data-card"><div class="data-label">開盤價</div><div id="sd-open" class="data-value">--</div></div>

  <div id="delete-confirm-modal" class="modal">
    <div class="confirm-box">
      <div class="confirm-title">確定要刪除這張照片嗎？</div>
      <p style="font-size: 18px; color: var(--text-sub);">刪除後將從本地資料庫永久移除。</p>
      <div class="confirm-btn-group">
        <button class="confirm-btn" style="background-color:var(--accent-red); color:#FFF;" onclick="confirmDeletePhoto()">確定刪除</button>
        <button class="confirm-btn no-btn" onclick="closeDeleteModal()">取消</button>

  <script>
    document.addEventListener('touchmove', function (e) {
      if (!e.target.closest('.photo-grid, .audio-list, .stock-list, .stock-detail-container, .zoom-container')) {
        e.preventDefault();
      }
    }, { passive: false });

    // === 即時時鐘 ===
    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock-date').innerText = `${year}/${month}/${date} ${dayName}`;
      document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // === IndexedDB 本地資料庫 ===
    let db = null;
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("ElderlyAppPhotoDB", 2);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
          }
          if (!db.objectStoreNames.contains("audios")) {
            db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function savePhotoToDB(type, url) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const req = store.add({ type, url, timestamp: Date.now() });
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function getAllPhotosFromDB() {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readonly");
        const store = tx.objectStore("photos");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.reverse());
        req.onerror = (e) => reject(e);
      });
    }

    async function deletePhotoFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    async function saveAudioToDB(url) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("audios", "readwrite");
        const store = tx.objectStore("audios");
        const req = store.add({ url, timestamp: Date.now() });
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function getAllAudiosFromDB() {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("audios", "readonly");
        const store = tx.objectStore("audios");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.reverse());
        req.onerror = (e) => reject(e);
      });
    }

    async function deleteAudioFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("audios", "readwrite");
        const store = tx.objectStore("audios");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    // 全域變數
    let albumList = [];
    let selectedPhotoIndex = -1;
    let currentZoomScale = 1;
    let translateX = 0, translateY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    function navTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
      document.getElementById(pageId).classList.add('active-page');
      if (pageId === 'page-photos') renderAlbum();
      if (pageId === 'page-audio') renderAudioList();
      if (pageId === 'page-stock') initStockList();
    }

    // === 相簿控制 ===
    async function renderAlbum() {
      const grid = document.getElementById('photo-list');
      grid.innerHTML = '';
      try { albumList = await getAllPhotosFromDB(); } catch (e) { albumList = []; }

      if (albumList.length === 0) {
        grid.innerHTML = `<div style="grid-column:span 2; text-align:center; color:var(--text-sub); font-size:20px; padding-top:40px;">目前尚無照片</div>`;
        return;
      }

      albumList.forEach((item, index) => {
        const el = document.createElement(item.type === 'image' ? 'img' : 'video');
        el.src = item.url;
        el.className = 'photo-item';
        el.onclick = () => openPhotoViewer(index);
        grid.appendChild(el);
      });
    }

    function openPhotoViewer(index) {
      selectedPhotoIndex = index;
      currentZoomScale = 1; translateX = 0; translateY = 0;
      const item = albumList[index];
      const wrapper = document.getElementById('media-wrapper');
      
      wrapper.innerHTML = item.type === 'image' 
        ? `<img id="enlarged-media-container" src="${item.url}">`
        : `<video id="enlarged-media-container" src="${item.url}" controls autoplay></video>`;

      applyTransform();
      document.getElementById('photo-viewer-modal').style.display = 'flex';
      setupDragEvents();
    }

    function closePhotoViewer() {
      document.getElementById('photo-viewer-modal').style.display = 'none';
    }

    function adjustZoom(delta) {
      currentZoomScale += delta;
      if (currentZoomScale < 0.8) currentZoomScale = 0.8;
      if (currentZoomScale > 4.0) currentZoomScale = 4.0;
      if (currentZoomScale === 1) { translateX = 0; translateY = 0; }
      applyTransform();
    }

    function applyTransform() {
      const wrapper = document.getElementById('media-wrapper');
      if (wrapper) {
        wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoomScale})`;
      }
    }

    function setupDragEvents() {
      const container = document.getElementById('zoom-container');
      const startDrag = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - translateX;
        startY = clientY - translateY;
      };

      const doDrag = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        translateX = clientX - startX;
        translateY = clientY - startY;
        applyTransform();
      };

      const stopDrag = () => { isDragging = false; };

      container.onmousedown = startDrag; container.onmousemove = doDrag;
      container.onmouseup = stopDrag; container.onmouseleave = stopDrag;
      container.ontouchstart = startDrag; container.ontouchmove = doDrag; container.ontouchend = stopDrag;
    }

    function askDeleteCurrentPhoto() { document.getElementById('delete-confirm-modal').style.display = 'flex'; }
    function closeDeleteModal() { document.getElementById('delete-confirm-modal').style.display = 'none'; }

    async function confirmDeletePhoto() {
      if (selectedPhotoIndex >= 0) {
        await deletePhotoFromDB(albumList[selectedPhotoIndex].id);
        closeDeleteModal();
        closePhotoViewer();
        renderAlbum();
      }
    }

    // === 錄音控制 ===
    let audioMediaRecorder = null, audioStream = null, audioChunks = [], isAudioRecording = false;

    async function toggleAudioRecord() {
      const btn = document.getElementById('audio-rec-btn');
      if (!isAudioRecording) {
        try {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          audioMediaRecorder = new MediaRecorder(audioStream);
          audioMediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          audioMediaRecorder.onstop = saveAudioRecord;
          audioMediaRecorder.start();
          isAudioRecording = true;
          btn.innerText = '⏹️ 停止錄音';
          btn.classList.add('cam-btn-recording');
        } catch (e) { alert('無法取得麥克風權限'); }
      } else {
        audioMediaRecorder.stop();
        stopAudioStream();
        isAudioRecording = false;
        btn.innerText = '🎙️ 開始錄音';
        btn.classList.remove('cam-btn-recording');
      }
    }

    function stopAudioStream() {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
    }

    async function saveAudioRecord() {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = async () => {
        await saveAudioToDB(reader.result);
        renderAudioList();
      };
      reader.readAsDataURL(blob);
    }

    async function renderAudioList() {
      const container = document.getElementById('audio-list');
      container.innerHTML = '';
      let audios = [];
      try { audios = await getAllAudiosFromDB(); } catch (e) { audios = []; }

      if (audios.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:20px; padding-top:40px;">目前無錄音紀錄</div>`;
        return;
      }

      audios.forEach(item => {
        const timeStr = new Date(item.timestamp).toLocaleString('zh-TW', { hour12: false });
        const card = document.createElement('div');
        card.className = 'audio-card';
        card.innerHTML = `
          <div class="audio-card-top">
            <span class="audio-date">🎙️ ${timeStr}</span>
            <button class="stock-delete-btn" onclick="deleteAudioItem(${item.id})">🗑️ 刪除</button>
          </div>
          <audio controls src="${item.url}"></audio>
        `;
        container.appendChild(card);
      });
    }

    async function deleteAudioItem(id) {
      await deleteAudioFromDB(id);
      renderAudioList();
    }

    // === 相機控制 ===
    let videoStream = null, mediaRecorder = null, recordedChunks = [], isRecording = false, currentCamMode = 'photo';

    function openCameraConfig() { document.getElementById('camera-config-modal').style.display = 'flex'; }
    function closeCameraConfig() { document.getElementById('camera-config-modal').style.display = 'none'; }

    async function applyCameraConfig() {
      currentCamMode = document.getElementById('cam-mode-select').value;
      const facing = document.getElementById('cam-facing-select').value;
      closeCameraConfig();

      const actionBtn = document.getElementById('cam-action-btn');
      actionBtn.innerText = currentCamMode === 'video' ? '開始錄影 🎥' : '拍照 📷';
      actionBtn.className = 'cam-btn';

      navTo('page-camera');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facing }, audio: currentCamMode === 'video' 
        });
        document.getElementById('camera-preview').srcObject = videoStream;
      } catch (e) { alert('無法開啟相機權限'); }
    }

    function handleCameraAction() {
      currentCamMode === 'photo' ? takePhoto() : (isRecording ? stopRecording() : startRecording());
    }

    async function takePhoto() {
      const video = document.getElementById('camera-preview');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      await savePhotoToDB('image', canvas.toDataURL('image/png'));
    }

    function startRecording() {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(videoStream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();
      isRecording = true;
      const btn = document.getElementById('cam-action-btn');
      btn.innerText = '停止錄影 ⏹️';
      btn.classList.add('cam-btn-recording');
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        const btn = document.getElementById('cam-action-btn');
        btn.innerText = '開始錄影 🎥';
        btn.classList.remove('cam-btn-recording');
      }
    }

    async function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const reader = new FileReader();
      reader.onloadend = async () => { await savePhotoToDB('video', reader.result); };
      reader.readAsDataURL(blob);
    }

    function stopCamera() {
      if (isRecording) stopRecording();
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    }

    // === 設定與調整 ===
    function adjustBrightness(val) { document.getElementById('brightness-overlay').style.opacity = val / 100; }
    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.value = 800;
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    // === 鍵盤輸入控制 ===
    function keypadInput(val) {
      const input = document.getElementById('stock-input');
      if (input.value.length < 5) input.value += val;
    }
    function keypadClear() { document.getElementById('stock-input').value = ''; }
    function keypadBackspace() {
      const input = document.getElementById('stock-input');
      input.value = input.value.slice(0, -1);
    }

    // === 股票資料庫與即時報價引擎 (雙數據源 API) ===
    let stockCodes = ['2330', '2317', '2454'];
    let stocksData = {};
    let currentStockCode = '2330', currentChartType = 'line', isChartZoomed = false;

    // 清理字串為純數字
    function cleanNum(val) {
      if (val === undefined || val === null) return 0;
      const s = String(val).replace(/,/g, '').replace(/--/g, '0').trim();
      return parseFloat(s) || 0;
    }

    // 第一備用：從 Yahoo Finance 公開 API 抓取精確資料
    async function fetchFromYahoo(code) {
      try {
        const symbol = `${code}.TW`;
        const url = `https://corsproxy.io/?${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d`)}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const json = await res.json();
        const result = json.chart?.result?.[0];
        if (!result) return null;

        const meta = result.meta;
        const name = meta.shortName || meta.symbol || code;
        const price = Math.round((meta.regularMarketPrice || 0) * 100) / 100;
        const prevClose = Math.round((meta.chartPreviousClose || price) * 100) / 100;
        const change = Math.round((price - prevClose) * 100) / 100;
        const open = Math.round((meta.regularMarketDayHigh ? meta.regularMarketDayLow : price) * 100) / 100;
        const high = Math.round((meta.regularMarketDayHigh || price) * 100) / 100;
        const low = Math.round((meta.regularMarketDayLow || price) * 100) / 100;
        const rawVol = meta.regularMarketVolume || 0;
        const volStr = rawVol > 0 ? (Math.round(rawVol / 1000).toLocaleString() + '張') : '資料更新中';

        const timestamps = result.timestamp || [];
        const quotes = result.indicators?.quote?.[0]?.close || [];
        let history = [];
        if (timestamps.length > 0 && quotes.length > 0) {
          for (let i = 0; i < timestamps.length; i += Math.max(1, Math.floor(timestamps.length / 5))) {
            if (quotes[i] !== null && quotes[i] !== undefined) {
              const date = new Date(timestamps[i] * 1000);
              const timeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
              history.push({ time: timeStr, price: Math.round(quotes[i] * 100) / 100 });
            }
          }
        }

        if (history.length < 2) {
          history = [
            { time: '09:00', price: open || price },
            { time: '13:30', price: price }
          ];
        }

        return {
          name: name,
          price: price,
          change: change,
          open: open,
          close: prevClose,
          high: high,
          low: low,
          vol: volStr,
          range52: `${meta.fiftyTwoWeekLow || low} - ${meta.fiftyTwoWeekHigh || high}`,
          history: history
        };
      } catch (e) {
        return null;
      }
    }

    // 第二備用：證交所官方 Open API
    async function fetchFromTWSE(code) {
      try {
        const url = `https://corsproxy.io/?${encodeURIComponent('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL')}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        const found = data.find(i => i.Code === code);
        if (!found) return null;

        const close = cleanNum(found.ClosingPrice);
        const open = cleanNum(found.OpeningPrice) || close;
        const high = cleanNum(found.HighestPrice) || close;
        const low = cleanNum(found.LowestPrice) || close;
        const rawChange = cleanNum(found.Change);
        // 判斷跌漲符號
        const isDown = String(found.Change).includes('-');
        const change = isDown ? -Math.abs(rawChange) : Math.abs(rawChange);
        const prevClose = Math.round((close - change) * 100) / 100;
        const rawVol = cleanNum(found.TradeVolume);
        const volStr = rawVol > 0 ? (Math.round(rawVol / 1000).toLocaleString() + '張') : '無交易';

        return {
          name: found.Name,
          price: close,
          change: change,
          open: open,
          close: prevClose,
          high: high,
          low: low,
          vol: volStr,
          range52: `${low} - ${high}`,
          history: [
            { time: '09:00', price: open },
            { time: '13:30', price: close }
          ]
        };
      } catch (e) {
        return null;
      }
    }

    async function fetchStockRealData(code) {
      let data = await fetchFromYahoo(code);
      if (!data) data = await fetchFromTWSE(code);
      return data;
    }

    async function initStockList() {
      const container = document.getElementById('stock-list-container');
      container.innerHTML = `<div style="text-align:center; color:var(--accent-yellow); font-size:20px; padding:40px 0;">正在連線證交所更新即時行情...</div>`;

      for (let code of stockCodes) {
        const real = await fetchStockRealData(code);
        if (real) stocksData[code] = real;
      }

      renderStockList();
    }

    function renderStockList() {
      const container = document.getElementById('stock-list-container');
      container.innerHTML = '';
      const keys = Object.keys(stocksData);

      if (keys.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:20px; padding:40px 0;">無股票資料，請點擊上方輸入新增</div>`;
        return;
      }

      keys.forEach(code => {
        const item = stocksData[code];
        const isUp = item.change >= 0;
        const card = document.createElement('div');
        card.className = 'stock-card';
        card.onclick = () => goToStockDetail(code);

        card.innerHTML = `
          <div style="flex:1;">
            <div class="stock-card-name">${item.name}</div>
            <div class="stock-card-code">${code}</div>
          </div>
          <div>
            <div class="stock-card-price ${isUp ? 'up' : 'down'}">${item.price}</div>
            <div class="stock-card-change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${item.change}</div>
          </div>
          <button class="stock-delete-btn" onclick="deleteStock(event, '${code}')">🗑️ 刪除</button>
        `;
        container.appendChild(card);
      });
    }

    async function addStock() {
      const input = document.getElementById('stock-input');
      const code = input.value.trim();
      if (!code) return alert('請先輸入 4 位股票代號！');
      if (stocksData[code]) return alert('此股票已在列表中！');

      const btn = document.getElementById('stock-add-btn');
      btn.innerText = '查詢中...'; btn.disabled = true;

      const realData = await fetchStockRealData(code);

      if (realData) {
        stocksData[code] = realData;
        if (!stockCodes.includes(code)) stockCodes.push(code);
        input.value = '';
        renderStockList();
      } else {
        alert('無法取得該股票數據，請確認代號是否正確或網路是否連線。');
      }

      btn.innerText = '➕ 新增'; btn.disabled = false;
    }

    function deleteStock(e, code) {
      e.stopPropagation();
      delete stocksData[code];
      stockCodes = stockCodes.filter(c => c !== code);
      renderStockList();
    }

    function goToStockDetail(code) {
      currentStockCode = code;
      const item = stocksData[code];
      if (!item) return;

      const isUp = item.change >= 0;

      document.getElementById('sd-title').innerText = `${item.name} (${code})`;
      document.getElementById('sd-price').innerText = item.price;
      document.getElementById('sd-price').className = `stock-detail-price ${isUp ? 'up' : 'down'}`;
      document.getElementById('sd-change').innerText = `${isUp ? '▲' : '▼'} ${isUp ? '+' : ''}${item.change}`;
      document.getElementById('sd-change').className = isUp ? 'up' : 'down';

      document.getElementById('sd-open').innerText = item.open;
      document.getElementById('sd-close').innerText = item.close;
      document.getElementById('sd-high').innerText = item.high;
      document.getElementById('sd-low').innerText = item.low;
      document.getElementById('sd-vol').innerText = item.vol;
      document.getElementById('sd-52w').innerText = item.range52;

      navTo('page-stock-detail');
      setTimeout(() => drawStockChart(), 60);
    }

    function switchChartTab(btn, type) {
      document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentChartType = type;
      drawStockChart();
    }

    function toggleChartZoom() {
      isChartZoomed = !isChartZoomed;
      const container = document.getElementById('chart-container-box');
      const btn = document.getElementById('chart-zoom-btn');

      if (isChartZoomed) {
        container.classList.add('enlarged');
        btn.innerText = '🔍 縮小圖表與數值';
      } else {
        container.classList.remove('enlarged');
        btn.innerText = '🔍 放大圖表與數值';
      }
      setTimeout(() => requestAnimationFrame(drawStockChart), 250);
    }

    function drawStockChart() {
      const canvas = document.getElementById('stockCanvas');
      const container = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      const width = container.clientWidth, height = container.clientHeight;
      canvas.width = width * 2; canvas.height = height * 2;
      ctx.scale(2, 2);

      const item = stocksData[currentStockCode];
      if (!item) return;

      const isUp = item.change >= 0;
      const color = isUp ? '#FF453A' : '#30D158';

      ctx.clearRect(0, 0, width, height);

      const fontPriceSize = isChartZoomed ? 'bold 18px -apple-system' : 'bold 13px -apple-system';
      const fontTimeSize = isChartZoomed ? 'bold 15px -apple-system' : 'bold 11px -apple-system';
      const paddingLeft = 35, paddingRight = 35, paddingTop = 30, paddingBottom = 25;
      const drawW = width - paddingLeft - paddingRight, drawH = height - paddingTop - paddingBottom;

      if (currentChartType === 'line') {
        const history = item.history;
        const prices = history.map(h => h.price);
        const minVal = Math.min(...prices), maxVal = Math.max(...prices);
        const valRange = (maxVal - minVal) || 1;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, paddingTop); ctx.lineTo(width - paddingRight, paddingTop);
        ctx.moveTo(paddingLeft, height - paddingBottom); ctx.lineTo(width - paddingRight, height - paddingBottom);
        ctx.stroke(); ctx.setLineDash([]);

        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = isChartZoomed ? 4 : 3;

        history.forEach((h, i) => {
          const x = paddingLeft + (i * drawW) / Math.max(1, history.length - 1);
          const y = (height - paddingBottom) - ((h.price - minVal) / valRange) * drawH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        history.forEach((h, i) => {
          const x = paddingLeft + (i * drawW) / Math.max(1, history.length - 1);
          const y = (height - paddingBottom) - ((h.price - minVal) / valRange) * drawH;

          ctx.beginPath(); ctx.arc(x, y, isChartZoomed ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = color; ctx.fill();

          ctx.font = fontPriceSize; ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(h.price, x, y - 6);

          ctx.font = fontTimeSize; ctx.fillStyle = '#98989D'; ctx.textBaseline = 'top';
          ctx.fillText(h.time, x, height - paddingBottom + 6);
        });
      } else {
        const candles = [
          { o: item.open, h: item.high, l: item.low, c: item.price, time: '今日行情' }
        ];

        candles.forEach((c, i) => {
          const x = width / 2;
          const isCandleUp = c.c >= c.o;
          const cColor = isCandleUp ? '#FF453A' : '#30D158';

          ctx.strokeStyle = cColor; ctx.fillStyle = cColor; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x, paddingTop); ctx.lineTo(x, height - paddingBottom); ctx.stroke();

          const boxH = Math.max(Math.abs(c.c - c.o) * 5, 30);
          const boxW = isChartZoomed ? 48 : 36;
          ctx.fillRect(x - (boxW / 2), (height / 2) - (boxH / 2), boxW, boxH);

          ctx.font = fontTimeSize; ctx.fillStyle = '#98989D'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText(c.time, x, height - paddingBottom + 8);
        });
      }
    }

    // === 計算機邏輯 ===
    let calcExpr = '';
    function calcNum(num) {
      calcExpr += num;
      document.getElementById('calc-display').innerText = calcExpr;
    }

    function calcOp(op) {
      if (calcExpr !== '' && !['+','-','*','/'].includes(calcExpr.slice(-1))) {
        calcExpr += op;
        document.getElementById('calc-display').innerText = calcExpr;
      }
    }

    function calcClear() {
      calcExpr = '';
      document.getElementById('calc-display').innerText = '0';
    }

    function calcEqual() {
      try {
        if (calcExpr) {
          calcExpr = String(eval(calcExpr));
          document.getElementById('calc-display').innerText = calcExpr;
        }
      } catch (e) {
        document.getElementById('calc-display').innerText = '錯誤';
        calcExpr = '';
      }
    }

    initDB();
  </script>
</body>
</html>
