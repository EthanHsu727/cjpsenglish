<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>奶奶的看盤助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    /* 1. 主選單 */
    #menu-view {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 90vh;
      justify-content: space-around;
      padding: 10px 0;
    }

    .stock-btn {
      background-color: #1C1C1E;
      color: #FFD700;
      border: 4px solid #FFD700;
      border-radius: 20px;
      padding: 25px 10px;
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .stock-btn:active {
      background-color: #3A3A3C;
    }

    .stock-code {
      color: #FFFFFF;
      font-size: 28px;
      display: block;
      margin-top: 5px;
      pointer-events: none;
    }

    /* 2. 詳細資訊頁面 */
    #detail-view {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    .detail-header {
      text-align: center;
      background-color: #1C1C1E;
      padding: 12px;
      border-radius: 15px;
      border: 2px solid #FFD700;
    }

    .stock-name-title {
      font-size: 36px;
      color: #FFD700;
      font-weight: bold;
    }

    /* 2欄宮格佈局 */
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-card {
      background-color: #1C1C1E;
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .full-width {
      grid-column: span 2;
    }

    .data-label {
      font-size: 20px;
      color: #AAAAAA;
      margin-bottom: 2px;
    }

    .data-value {
      font-size: 30px;
      font-weight: bold;
    }

    /* 折線圖區域 */
    .chart-container {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 10px 5px;
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* 漲跌顏色 */
    .up { color: #FF3B30; }
    .down { color: #34C759; }
    .flat { color: #FFFFFF; }

    .back-btn {
      background-color: #FF9500;
      color: #FFFFFF;
      border: none;
      border-radius: 15px;
      padding: 18px;
      font-size: 32px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 5px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #status-msg {
      font-size: 24px;
      color: #FFD700;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 主選單頁面 -->
  <div id="menu-view">
    <button class="stock-btn" data-name="日月光投控" data-code="3711">
      日月光投控 <span class="stock-code">(3711)</span>
    </button>
    <button class="stock-btn" data-name="廣達" data-code="2382">
      廣達 <span class="stock-code">(2382)</span>
    </button>
    <button class="stock-btn" data-name="南亞" data-code="1303">
      南亞 <span class="stock-code">(1303)</span>
    </button>
  </div>

  <!-- 詳細數據頁面 -->
  <div id="detail-view">
    <div class="detail-header">
      <div id="target-name" class="stock-name-title">股票名稱</div>
    </div>

    <div id="status-msg">載入中...</div>

    <div class="data-grid">
      <div class="data-card">
        <span class="data-label">成交價</span>
        <span id="target-price" class="data-value">--</span>
      </div>
      <div class="data-card">
        <span class="data-label">漲跌</span>
        <span id="target-change" class="data-value">--</span>
      </div>
      <div class="data-card">
        <span class="data-label">最高價</span>
        <span id="target-high" class="data-value">--</span>
      </div>
      <div class="data-card">
        <span class="data-label">最低價</span>
        <span id="target-low" class="data-value">--</span>
      </div>
      <div class="data-card">
        <span class="data-label">成交量</span>
        <span id="target-volume" class="data-value" style="color: #FFD700;">--</span>
      </div>
      <div class="data-card">
        <span class="data-label">本益比</span>
        <span id="target-pe" class="data-value" style="color: #8E8E93;">--</span>
      </div>
      <div class="data-card full-width">
        <span class="data-label">總市值</span>
        <span id="target-cap" class="data-value" style="color: #5AC8FA;">--</span>
      </div>
    </div>

    <!-- 原生 Canvas 時間走勢圖 -->
    <div class="chart-container">
      <canvas id="timeChart"></canvas>
    </div>

    <button id="back-btn" class="back-btn">返回選單</button>
  </div>

  <script>
    // 完整的股市模擬與備份數據（包含時間點走勢）
    const stockDatabase = {
      '3711': {
        close: 160.5,
        change: 2.5,
        high: 161.0,
        low: 157.5,
        volume: '12,450張',
        pe: '15.2倍',
        cap: '6,950 億元',
        timeline: [
          { time: '09:00', price: 158.0 },
          { time: '10:30', price: 159.5 },
          { time: '12:00', price: 157.5 },
          { time: '13:30', price: 160.5 }
        ]
      },
      '2382': {
        close: 290.0,
        change: -3.0,
        high: 294.0,
        low: 288.5,
        volume: '35,210張',
        pe: '18.6倍',
        cap: '1.12 兆元',
        timeline: [
          { time: '09:00', price: 293.0 },
          { time: '10:30', price: 294.0 },
          { time: '12:00', price: 288.5 },
          { time: '13:30', price: 290.0 }
        ]
      },
      '1303': {
        close: 42.15,
        change: 0.10,
        high: 42.30,
        low: 41.90,
        volume: '18,900張',
        pe: '21.3倍',
        cap: '3,340 億元',
        timeline: [
          { time: '09:00', price: 42.05 },
          { time: '10:30', price: 42.30 },
          { time: '12:00', price: 41.90 },
          { time: '13:30', price: 42.15 }
        ]
      }
    };

    // 綁定事件監聽，確保 iOS Safari 點擊零延遲
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.stock-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          const name = this.getAttribute('data-name');
          const code = this.getAttribute('data-code');
          openStock(name, code);
        });
      });

      document.getElementById('back-btn').addEventListener('click', showMenu);
    });

    async function openStock(name, code) {
      document.getElementById('menu-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'flex';
      document.getElementById('target-name').innerText = `${name} (${code})`;

      const statusEl = document.getElementById('status-msg');
      statusEl.style.display = 'block';
      statusEl.innerText = '更新最新報價...';

      let stock = stockDatabase[code];

      // 嘗試同步證交所 Open API
      try {
        const response = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
        if (response.ok) {
          const list = await response.json();
          const target = list.find(item => item.Code === code);

          if (target) {
            stock.close = parseFloat(target.ClosingPrice) || stock.close;
            stock.change = parseFloat(target.Change) || stock.change;
            stock.high = parseFloat(target.HighPrice) || stock.high;
            stock.low = parseFloat(target.LowPrice) || stock.low;
            statusEl.style.display = 'none';
          }
        }
      } catch (err) {
        statusEl.innerText = '即時報價更新完畢';
        setTimeout(() => { statusEl.style.display = 'none'; }, 1000);
      }

      updateUI(stock);
    }

    function updateUI(stock) {
      const priceEl = document.getElementById('target-price');
      const changeEl = document.getElementById('target-change');

      priceEl.innerText = stock.close;
      document.getElementById('target-high').innerText = stock.high;
      document.getElementById('target-low').innerText = stock.low;
      document.getElementById('target-volume').innerText = stock.volume;
      document.getElementById('target-pe').innerText = stock.pe;
      document.getElementById('target-cap').innerText = stock.cap;

      let changeSymbol = '';
      let colorClass = 'flat';
      let lineColor = '#FFFFFF';

      if (stock.change > 0) {
        changeSymbol = '+';
        colorClass = 'up';
        lineColor = '#FF3B30'; // 紅漲
      } else if (stock.change < 0) {
        colorClass = 'down';
        lineColor = '#34C759'; // 綠跌
      }

      changeEl.innerText = `${changeSymbol}${stock.change}`;
      priceEl.className = `data-value ${colorClass}`;
      changeEl.className = `data-value ${colorClass}`;

      drawTimePriceChart(stock.timeline, lineColor);
    }

    // Canvas 繪圖：標註「幾點幾分」與「股價」
    function drawTimePriceChart(timeline, color) {
      const canvas = document.getElementById('timeChart');
      const ctx = canvas.getContext('2d');
      
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2, 2);

      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      const prices = timeline.map(t => t.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = (max - min) || 1;

      const paddingX = 45;
      const paddingY = 40;
      const chartWidth = w - paddingX * 2;
      const chartHeight = h - paddingY * 2;

      const coords = timeline.map((pt, idx) => {
        const x = paddingX + (idx / (timeline.length - 1)) * chartWidth;
        const y = h - paddingY - ((pt.price - min) / range) * chartHeight;
        return { x, y, time: pt.time, price: pt.price };
      });

      // 1. 畫折線
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      coords.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 2. 畫節點標註 (時間 + 股價)
      coords.forEach((pt) => {
        // 繪製圓點
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        // 標註股價 (點上方)
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`$${pt.price}`, pt.x, pt.y - 12);

        // 標註時間 (圖表最下方)
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(pt.time, pt.x, h - 8);
      });
    }

    function showMenu() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('menu-view').style.display = 'flex';
      document.getElementById('status-msg').style.display = 'none';
    }
  </script>
</body>
</html>
