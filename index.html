<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡大字助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    html, body {
      height: 100%;
      background-color: #000000;
      color: #FFFFFF;
      overflow: hidden;
    }

    body {
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 亮度遮罩 */
    #brightness-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      padding-bottom: 24px;
      gap: 12px;
      box-sizing: border-box;
    }

    .active-page {
      display: flex;
    }

    /* 通用返回按鈕 */
    .back-btn {
      background-color: #FF9500;
      color: #FFFFFF;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 26px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: auto;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* 時鐘顯示區塊 */
    .home-clock-box {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .clock-top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-date { font-size: 22px; color: #E5E5EA; font-weight: bold; }

    .clock-time {
      font-size: 48px;
      color: #FFD700;
      font-weight: bold;
      font-family: "Courier New", Courier, monospace;
      line-height: 1.1;
      text-align: center;
    }

    /* 選單 */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      align-content: stretch;
    }

    .app-card {
      background-color: #1C1C1E;
      border: 3px solid #3A3A3C;
      border-radius: 20px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app-card:active { background-color: #2C2C2E; }
    .app-icon { font-size: 42px; }
    .app-name { font-size: 22px; font-weight: bold; color: #FFFFFF; }

    /* 設定頁面 */
    .setting-item {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-label { font-size: 26px; color: #FFD700; font-weight: bold; }
    input[type=range] { width: 100%; height: 35px; accent-color: #FFD700; }

    /* 相機頁面 */
    #camera-preview {
      width: 100%;
      flex: 1;
      min-height: 0;
      background-color: #1C1C1E;
      border-radius: 15px;
      object-fit: cover;
    }

    .cam-btn {
      background-color: #30D158;
      color: #000;
      font-size: 30px;
      font-weight: bold;
      padding: 16px;
      border-radius: 15px;
      border: none;
      width: 100%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cam-btn-recording { background-color: #FF3B30 !important; color: #FFF !important; }

    /* 照片頁面 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .photo-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #2C2C2E;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid #48484A;
      cursor: pointer;
    }

    /* 錄音頁面與卡片 */
    .audio-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .audio-card {
      background-color: #1C1C1E;
      border: 2px solid #3A3A3C;
      border-radius: 15px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .audio-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-date { font-size: 18px; color: #FFD700; font-weight: bold; }

    audio {
      width: 100%;
      height: 45px;
    }

    /* 股票頁面 */
    .stock-search-box {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .stock-input {
      flex: 1;
      min-width: 0;
      background-color: #1C1C1E;
      border: 2px solid #FFD700;
      border-radius: 12px;
      padding: 12px;
      font-size: 20px;
      color: #FFF;
      font-weight: bold;
    }

    .stock-search-btn {
      flex-shrink: 0;
      background-color: #FFD700;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .stock-list { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      flex: 1; 
      min-height: 0; 
      overflow-y: auto; 
    }
    
    .stock-card {
      background-color: #1C1C1E;
      border: 2px solid #3A3A3C;
      border-radius: 15px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      gap: 8px;
    }

    .stock-card:active { background-color: #2C2C2E; }
    .stock-card-name { font-size: 22px; font-weight: bold; color: #FFF; }
    .stock-card-code { font-size: 18px; color: #AAA; }
    .stock-card-price { font-size: 24px; font-weight: bold; text-align: right; }
    .stock-card-change { font-size: 18px; font-weight: bold; text-align: right; }

    .stock-delete-btn {
      background-color: #FF3B30;
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .stock-detail-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .stock-header-info {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      border: 2px solid #FFD700;
      flex-shrink: 0;
    }

    .stock-detail-title { font-size: 26px; font-weight: bold; color: #FFD700; }
    .stock-detail-price { font-size: 38px; font-weight: bold; margin: 4px 0; }
    
    .data-grid-single { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    .data-card { 
      background-color: #1C1C1E; 
      border-radius: 12px; 
      padding: 12px; 
      text-align: center; 
      border: 2px solid #3A3A3C; 
    }
    .data-label { font-size: 22px; color: #AAA; font-weight: bold; }
    .data-value { font-size: 30px; font-weight: bold; margin-top: 4px; }
    
    .chart-container { 
      background-color: #1C1C1E; 
      border-radius: 15px; 
      height: 200px; 
      padding: 8px; 
      flex-shrink: 0; 
      position: relative;
      overflow: hidden;
      transition: height 0.2s ease-in-out;
    }
    .chart-container.enlarged {
      height: 300px;
    }

    #stockCanvas { width: 100%; height: 100%; display: block; }

    .chart-tab-group { display: flex; gap: 8px; flex-shrink: 0; }
    .chart-tab { flex: 1; background-color: #2C2C2E; color: #FFF; border: none; padding: 10px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; }
    .chart-tab.active { background-color: #FFD700; color: #000; }

    .chart-zoom-btn {
      background-color: #0A84FF;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* 計算機頁面 */
    .calc-display {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 15px;
      padding: 15px;
      font-size: 40px;
      font-weight: bold;
      text-align: right;
      color: #FFD700;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .calc-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      flex: 1;
      min-height: 0;
    }
    
    .calc-btn { 
      background-color: #2C2C2E; 
      color: #FFF; 
      font-size: 30px; 
      font-weight: bold; 
      border-radius: 12px; 
      border: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .calc-btn:active { opacity: 0.8; }
    .calc-op { background-color: #FF9500; color: #FFF; }
    .calc-clear { background-color: #FF3B30; color: #FFF; }
    .calc-eq { background-color: #30D158; color: #000; }

    .up { color: #FF3B30; }
    .down { color: #34C759; }

    /* Modal 彈窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .zoom-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #1C1C1E;
      border-radius: 15px;
      touch-action: none;
      position: relative;
    }

    #media-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    #enlarged-media-container {
      max-width: 100%;
      max-height: 100%;
      pointer-events: none;
    }

    .modal-btn-group { display: flex; gap: 8px; width: 100%; flex-shrink: 0; }

    .action-btn {
      flex: 1;
      padding: 14px 6px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      color: #FFF;
      cursor: pointer;
    }

    .zoom-btn { background-color: #0A84FF; }
    .delete-btn { background-color: #FF3B30; }

    .confirm-box {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      width: 95%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .confirm-title { font-size: 26px; color: #FFF; font-weight: bold; }
    .confirm-btn-group { display: flex; gap: 12px; }

    .confirm-btn {
      flex: 1;
      padding: 14px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    .yes-btn { background-color: #30D158; color: #000; }
    .no-btn { background-color: #8E8E93; color: #FFF; }

    .custom-select {
      font-size: 22px;
      padding: 12px;
      border-radius: 12px;
      background-color: #2C2C2E;
      color: #FFD700;
      border: 2px solid #FFD700;
      width: 100%;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="brightness-overlay"></div>

  <div id="page-home" class="page active-page">
    <div class="home-clock-box">
      <div class="clock-top-bar">
        <div id="clock-date" class="clock-date">----年--月--日 星期-</div>
      </div>
      <div id="clock-time" class="clock-time">00:00:00</div>
    </div>

    <div class="app-grid">
      <div class="app-card" onclick="navTo('page-settings')">
        <div class="app-icon">⚙️</div>
        <div class="app-name">設定</div>
      </div>
      <div class="app-card" onclick="openCameraConfig()">
        <div class="app-icon">📷</div>
        <div class="app-name">相機</div>
      </div>
      <div class="app-card" onclick="navTo('page-photos')">
        <div class="app-icon">🖼️</div>
        <div class="app-name">照片</div>
      </div>
      <div class="app-card" onclick="navTo('page-audio')">
        <div class="app-icon">🎙️</div>
        <div class="app-name">錄音</div>
      </div>
      <div class="app-card" onclick="navTo('page-stock')">
        <div class="app-icon">📈</div>
        <div class="app-name">股票</div>
      </div>
      <div class="app-card" onclick="navTo('page-calc')">
        <div class="app-icon">🧮</div>
        <div class="app-name">計算機</div>
      </div>
    </div>
  </div>

  <div id="page-settings" class="page">
    <div class="setting-item">
      <div class="setting-label">螢幕亮度</div>
      <input type="range" id="brightness-slider" min="0" max="80" value="0" oninput="adjustBrightness(this.value)">
    </div>

    <div class="setting-item">
      <div class="setting-label">提示音量</div>
      <input type="range" min="0" max="100" value="80" onchange="playBeep()">
    </div>

    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-camera" class="page">
    <video id="camera-preview" autoplay playsinline></video>
    <button id="cam-action-btn" class="cam-btn" onclick="handleCameraAction()">拍照</button>
    <button class="back-btn" onclick="stopCamera(); navTo('page-home');">返回首頁</button>
  </div>

  <div id="page-photos" class="page">
    <div id="photo-list" class="photo-grid"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-audio" class="page">
    <button id="audio-rec-btn" class="cam-btn" style="background-color: #FF9500; color: #FFF;" onclick="toggleAudioRecord()">🎙️ 開始錄音</button>
    <div id="audio-list" class="audio-list"></div>
    <button class="back-btn" onclick="stopAudioStream(); navTo('page-home');">返回首頁</button>
  </div>

  <div id="page-stock" class="page">
    <div class="stock-search-box">
      <input type="text" id="stock-input" class="stock-input" placeholder="輸入代號 (如 2303)">
      <button class="stock-search-btn" onclick="addStock()">➕ 新增</button>
    </div>
    <div class="stock-list" id="stock-list-container"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="page-stock-detail" class="page">
    <div class="stock-detail-container">
      <div class="stock-header-info">
        <div id="sd-title" class="stock-detail-title">--</div>
        <div id="sd-price" class="stock-detail-price">--</div>
        <div id="sd-change" style="font-size: 24px; font-weight: bold;">--</div>
      </div>

      <div class="chart-tab-group">
        <button class="chart-tab active" onclick="switchChartTab(this, 'line')">折線圖</button>
        <button class="chart-tab" onclick="switchChartTab(this, 'kline')">K線圖</button>
      </div>

      <div class="chart-container" id="chart-container-box">
        <canvas id="stockCanvas"></canvas>
      </div>

      <button id="chart-zoom-btn" class="chart-zoom-btn" onclick="toggleChartZoom()">🔍 放大圖表與數值</button>

      <div class="data-grid-single">
        <div class="data-card"><div class="data-label">開盤價</div><div id="sd-open" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">昨收價</div><div id="sd-close" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">最高價</div><div id="sd-high" class="data-value up">--</div></div>
        <div class="data-card"><div class="data-label">最低價</div><div id="sd-low" class="data-value down">--</div></div>
        <div class="data-card"><div class="data-label">成交量</div><div id="sd-vol" class="data-value" style="color:#FFD700">--</div></div>
        <div class="data-card"><div class="data-label">本益比</div><div id="sd-pe" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">市值</div><div id="sd-cap" class="data-value" style="color:#5AC8FA">--</div></div>
        <div class="data-card"><div class="data-label">52週高/低</div><div id="sd-52w" class="data-value" style="font-size:24px;">--</div></div>
      </div>
    </div>

    <button class="back-btn" onclick="navTo('page-stock')">返回股票列表</button>
  </div>

  <div id="page-calc" class="page">
    <div id="calc-display" class="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn calc-clear" onclick="calcClear()">清除</button>
      <button class="calc-btn calc-op" onclick="calcOp('/')">÷</button>
      <button class="calc-btn calc-op" onclick="calcOp('*')">×</button>
      <button class="calc-btn calc-op" onclick="calcOp('-')">-</button>

      <button class="calc-btn" onclick="calcNum('7')">7</button>
      <button class="calc-btn" onclick="calcNum('8')">8</button>
      <button class="calc-btn" onclick="calcNum('9')">9</button>
      <button class="calc-btn calc-op" onclick="calcOp('+')">+</button>

      <button class="calc-btn" onclick="calcNum('4')">4</button>
      <button class="calc-btn" onclick="calcNum('5')">5</button>
      <button class="calc-btn" onclick="calcNum('6')">6</button>
      <button class="calc-btn calc-eq" style="grid-row: span 2; height:100%;" onclick="calcEqual()">=</button>

      <button class="calc-btn" onclick="calcNum('1')">1</button>
      <button class="calc-btn" onclick="calcNum('2')">2</button>
      <button class="calc-btn" onclick="calcNum('3')">3</button>

      <button class="calc-btn" style="grid-column: span 2;" onclick="calcNum('0')">0</button>
      <button class="calc-btn" onclick="calcNum('.')">.</button>
    </div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <div id="camera-config-modal" class="modal">
    <div class="confirm-box">
      <div class="confirm-title" style="color:#FFD700;">相機功能設定</div>
      <div style="text-align: left;">
        <label class="setting-label" style="font-size:20px;">1. 選擇模式：</label>
        <select id="cam-mode-select" class="custom-select" style="margin-top: 6px;">
          <option value="photo">📷 拍照模式</option>
          <option value="video">🎥 錄影模式</option>
        </select>
      </div>
      <div style="text-align: left;">
        <label class="setting-label" style="font-size:20px;">2. 選擇鏡頭：</label>
        <select id="cam-facing-select" class="custom-select" style="margin-top: 6px;">
          <option value="environment">後鏡頭 (拍風景)</option>
          <option value="user">前鏡頭 (自拍)</option>
        </select>
      </div>
      <div class="confirm-btn-group">
        <button class="confirm-btn yes-btn" onclick="applyCameraConfig()">進入相機</button>
        <button class="confirm-btn no-btn" onclick="closeCameraConfig()">取消</button>
      </div>
    </div>
  </div>

  <div id="photo-viewer-modal" class="modal">
    <div class="modal-content">
      <div class="zoom-container" id="zoom-container">
        <div id="media-wrapper"></div>
      </div>
      <div class="modal-btn-group">
        <button class="action-btn zoom-btn" onclick="adjustZoom(0.3)">放大 🔍+</button>
        <button class="action-btn zoom-btn" onclick="adjustZoom(-0.3)">縮小 🔍-</button>
        <button class="action-btn delete-btn" onclick="askDeleteCurrentPhoto()">刪除 🗑️</button>
      </div>
      <button class="back-btn" onclick="closePhotoViewer()">返回相簿</button>
    </div>
  </div>

  <div id="delete-confirm-modal" class="modal">
    <div class="confirm-box">
      <div class="confirm-title">確定要刪除這張照片嗎？</div>
      <p style="font-size: 20px; color: #AAA;">刪除後將從本地資料庫永久移除。</p>
      <div class="confirm-btn-group">
        <button class="confirm-btn" style="background-color:#FF3B30; color:#FFF;" onclick="confirmDeletePhoto()">確定刪除</button>
        <button class="confirm-btn no-btn" onclick="closeDeleteModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    // === 0. 即時時鐘邏輯 ===
    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

    // === IndexedDB 本地資料庫處理 ===
    let db = null;
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("ElderlyAppPhotoDB", 2);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
          }
          if (!db.objectStoreNames.contains("audios")) {
            db.createObjectStore("audios", { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    // --- 照片/影片 DB 操作 ---
    async function savePhotoToDB(type, url) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const item = { type, url, timestamp: Date.now() };
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function getAllPhotosFromDB() {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readonly");
        const store = tx.objectStore("photos");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.reverse());
        req.onerror = (e) => reject(e);
      });
    }

    async function deletePhotoFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function applyTransform() {
      const wrapper = document.getElementById('media-wrapper');
      if (wrapper) {
        wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoomScale})`;
      }

    function setupDragEvents() {
      const container = document.getElementById('zoom-container');

      const startDrag = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - translateX;
        startY = clientY - translateY;
      };

      const doDrag = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        translateX = clientX - startX;
        translateY = clientY - startY;
        applyTransform();
      };

      const stopDrag = () => { isDragging = false; };

      container.onmousedown = startDrag;
      container.onmousemove = doDrag;
      container.onmouseup = stopDrag;
      container.onmouseleave = stopDrag;

      container.ontouchstart = startDrag;
      container.ontouchmove = doDrag;
      container.ontouchend = stopDrag;
    }

    function drawStockChart() {
      const canvas = document.getElementById('stockCanvas');
      const container = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      canvas.width = width * 2;
      canvas.height = height * 2;
      ctx.scale(2, 2);

      const item = stocksData[currentStockCode];
      if (!item) return;

      const isUp = item.change >= 0;
      const color = isUp ? '#FF3B30' : '#34C759';

      ctx.clearRect(0, 0, width, height);

      const fontPriceSize = isChartZoomed ? 'bold 18px sans-serif' : 'bold 13px sans-serif';
      const fontTimeSize = isChartZoomed ? 'bold 15px sans-serif' : 'bold 11px sans-serif';
      
      const paddingLeft = isChartZoomed ? 40 : 35;
      const paddingRight = isChartZoomed ? 40 : 35;
      const paddingTop = isChartZoomed ? 40 : 30;
      const paddingBottom = isChartZoomed ? 35 : 25;

      const drawW = width - paddingLeft - paddingRight;
      const drawH = height - paddingTop - paddingBottom;

      if (currentChartType === 'line') {
        const history = item.history || [
          { time: '09:00', price: item.open },
          { time: '10:30', price: item.low },
          { time: '12:00', price: item.high },
          { time: '13:30', price: item.price }
        ];

        const prices = history.map(h => h.price);
        const minVal = Math.min(...prices);
        const maxVal = Math.max(...prices);
        const valRange = (maxVal - minVal) || 1;

        ctx.strokeStyle = '#3A3A3C';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, paddingTop);
        ctx.lineTo(width - paddingRight, paddingTop);
        ctx.moveTo(paddingLeft, height - paddingBottom);
        ctx.lineTo(width - paddingRight, height - paddingBottom);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = isChartZoomed ? 4 : 3;

        history.forEach((h, i) => {
          const x = paddingLeft + (i * drawW) / (history.length - 1);
          const y = (height - paddingBottom) - ((h.price - minVal) / valRange) * drawH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        history.forEach((h, i) => {
          const x = paddingLeft + (i * drawW) / (history.length - 1);
          const y = (height - paddingBottom) - ((h.price - minVal) / valRange) * drawH;

          ctx.beginPath();
          ctx.arc(x, y, isChartZoomed ? 6 : 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();

          ctx.font = fontPriceSize;
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(h.price, x, y - (isChartZoomed ? 8 : 6));

          ctx.font = fontTimeSize;
          ctx.fillStyle = '#AAA';
          ctx.textBaseline = 'top';
          ctx.fillText(h.time, x, height - paddingBottom + (isChartZoomed ? 8 : 6));
        });

      } else {
        const candles = [
          { o: item.open, h: item.open + 4, l: item.open - 3, c: item.open + 1, time: '09:00' },
          { o: item.open + 1, h: item.high, l: item.low, c: item.price, time: '13:30' }
        ];

        candles.forEach((c, i) => {
          const x = paddingLeft + (i + 1) * (drawW / 3);
          const isCandleUp = c.c >= c.o;
          const cColor = isCandleUp ? '#FF3B30' : '#34C759';

          ctx.strokeStyle = cColor;
          ctx.fillStyle = cColor;
          ctx.lineWidth = isChartZoomed ? 3 : 2;

          ctx.beginPath();
          ctx.moveTo(x, paddingTop);
          ctx.lineTo(x, height - paddingBottom);
          ctx.stroke();

          const boxH = Math.max(Math.abs(c.c - c.o) * 5, 20);
          const boxW = isChartZoomed ? 36 : 28;
          ctx.fillRect(x - (boxW / 2), (height / 2) - (boxH / 2), boxW, boxH);

          ctx.font = fontTimeSize;
          ctx.fillStyle = '#AAA';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(c.time, x, height - paddingBottom + 8);
        });
      }
    }

    // === 6. 計算機邏輯 ===
    let calcExpr = '';
    function calcNum(num) {
      calcExpr += num;
      document.getElementById('calc-display').innerText = calcExpr;
    }

    function calcOp(op) {
      if (calcExpr !== '' && !['+','-','*','/'].includes(calcExpr.slice(-1))) {
        calcExpr += op;
        document.getElementById('calc-display').innerText = calcExpr;
      }
    }

    function calcClear() {
      calcExpr = '';
      document.getElementById('calc-display').innerText = '0';
    }

    function calcEqual() {
      try {
        if (calcExpr) {
          const res = eval(calcExpr);
          calcExpr = String(res);
          document.getElementById('calc-display').innerText = calcExpr;
        }
      } catch (e) {
        document.getElementById('calc-display').innerText = '錯誤';
        calcExpr = '';
      }
    }

    // 初始化 DB
    initDB();
  </script>
</body>
</html>
