<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>奶奶的看盤助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 15px;
    }

    /* 主選單 */
    #menu-view {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 90vh;
      justify-content: space-around;
    }

    .stock-btn {
      background-color: #1C1C1E;
      color: #FFD700;
      border: 4px solid #FFD700;
      border-radius: 20px;
      padding: 25px 10px;
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .stock-btn:active {
      background-color: #3A3A3C;
    }

    .stock-code {
      color: #FFFFFF;
      font-size: 28px;
      display: block;
      margin-top: 5px;
      pointer-events: none;
    }

    /* 股票詳細資訊頁 */
    #detail-view {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .detail-header {
      text-align: center;
      background-color: #1C1C1E;
      padding: 12px;
      border-radius: 15px;
    }

    .stock-name-title {
      font-size: 36px;
      color: #FFD700;
      font-weight: bold;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-card {
      background-color: #1C1C1E;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .data-label {
      font-size: 22px;
      color: #AAAAAA;
      margin-bottom: 2px;
    }

    .data-value {
      font-size: 34px;
      font-weight: bold;
    }

    /* 原生圖表容器 */
    .chart-container {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 10px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .up { color: #FF3B30; }
    .down { color: #34C759; }
    .flat { color: #FFFFFF; }

    .back-btn {
      background-color: #FF9500;
      color: #FFFFFF;
      border: none;
      border-radius: 15px;
      padding: 18px;
      font-size: 32px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 5px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #status-msg {
      font-size: 28px;
      color: #FFD700;
      text-align: center;
      margin: 10px 0;
      display: none;
    }
  </style>
</head>
<body>

  <!-- 1. 主選單頁面 -->
  <div id="menu-view">
    <button class="stock-btn" data-name="日月光投控" data-code="3711">
      日月光投控 <span class="stock-code">(3711)</span>
    </button>
    <button class="stock-btn" data-name="廣達" data-code="2382">
      廣達 <span class="stock-code">(2382)</span>
    </button>
    <button class="stock-btn" data-name="南亞" data-code="1303">
      南亞 <span class="stock-code">(1303)</span>
    </button>
  </div>

  <!-- 2. 詳細數據頁面 -->
  <div id="detail-view">
    <div class="detail-header">
      <div id="target-name" class="stock-name-title">股票名稱</div>
    </div>

    <div id="status-msg">載入資料中...</div>

    <div id="data-container">
      <div class="data-grid">
        <div class="data-card">
          <span class="data-label">成交價</span>
          <span id="target-price" class="data-value">--</span>
        </div>
        <div class="data-card">
          <span class="data-label">漲跌</span>
          <span id="target-change" class="data-value">--</span>
        </div>
        <div class="data-card">
          <span class="data-label">最高價</span>
          <span id="target-high" class="data-value">--</span>
        </div>
        <div class="data-card">
          <span class="data-label">最低價</span>
          <span id="target-low" class="data-value">--</span>
        </div>
      </div>
    </div>

    <!-- 原生 Canvas 折線圖 -->
    <div class="chart-container">
      <canvas id="customChart"></canvas>
    </div>

    <button id="back-btn" class="back-btn">返回選單</button>
  </div>

  <script>
    // 預設靜態數據（確保網路異常或本機開啟時 100% 能點擊並顯示內容）
    const fallbackData = {
      '3711': { close: 160.5, change: 2.5, open: 158.0, high: 161.0, low: 157.5 },
      '2382': { close: 290.0, change: -3.0, open: 293.0, high: 294.0, low: 288.5 },
      '1303': { close: 42.15, change: 0.10, open: 42.05, high: 42.30, low: 41.90 }
    };

    // 使用標準事件綁定，避免 iPhone inline onclick 失效
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.stock-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function() {
          const name = this.getAttribute('data-name');
          const code = this.getAttribute('data-code');
          openStock(name, code);
        });
      });

      document.getElementById('back-btn').addEventListener('click', showMenu);
    });

    async function openStock(name, code) {
      document.getElementById('menu-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'flex';
      document.getElementById('target-name').innerText = `${name} (${code})`;

      const statusEl = document.getElementById('status-msg');
      statusEl.style.display = 'block';
      statusEl.innerText = '讀取中...';

      let stock = fallbackData[code];

      try {
        const response = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
        if (response.ok) {
          const list = await response.json();
          const target = list.find(item => item.Code === code);

          if (target) {
            stock = {
              close: parseFloat(target.ClosingPrice) || stock.close,
              change: parseFloat(target.Change) || stock.change,
              open: parseFloat(target.OpeningPrice) || stock.open,
              high: parseFloat(target.HighPrice) || stock.high,
              low: parseFloat(target.LowPrice) || stock.low
            };
            statusEl.style.display = 'none';
          }
        }
      } catch (err) {
        statusEl.innerText = '已載入保底數據';
      }

      updateUI(stock);
    }

    function updateUI(stock) {
      const priceEl = document.getElementById('target-price');
      const changeEl = document.getElementById('target-change');

      priceEl.innerText = stock.close;
      document.getElementById('target-high').innerText = stock.high;
      document.getElementById('target-low').innerText = stock.low;

      let changeSymbol = '';
      let colorClass = 'flat';
      let lineColor = '#FFFFFF';

      if (stock.change > 0) {
        changeSymbol = '+';
        colorClass = 'up';
        lineColor = '#FF3B30';
      } else if (stock.change < 0) {
        colorClass = 'down';
        lineColor = '#34C759';
      }

      changeEl.innerText = `${changeSymbol}${stock.change}`;
      priceEl.className = `data-value ${colorClass}`;
      changeEl.className = `data-value ${colorClass}`;

      drawNativeChart([stock.open, stock.low, stock.high, stock.close], lineColor);
    }

    // 原生 Canvas 繪圖（無需下載任何外部 js）
    function drawNativeChart(points, color) {
      const canvas = document.getElementById('customChart');
      const ctx = canvas.getContext('2d');
      
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      ctx.scale(2, 2);

      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      const labels = ['開盤', '最低', '最高', '現價'];
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = (max - min) || 1;

      const paddingX = 40;
      const paddingY = 30;
      const chartWidth = w - paddingX * 2;
      const chartHeight = h - paddingY * 2;

      const coords = points.map((val, idx) => {
        const x = paddingX + (idx / (points.length - 1)) * chartWidth;
        const y = h - paddingY - ((val - min) / range) * chartHeight;
        return { x, y, val };
      });

      // 畫線
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      coords.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 畫點與標籤
      coords.forEach((pt, i) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(labels[i], pt.x, h - 5);
      });
    }

    function showMenu() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('menu-view').style.display = 'flex';
      document.getElementById('status-msg').style.display = 'none';
    }
  </script>
</body>
</html>
