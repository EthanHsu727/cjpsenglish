<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡大字助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    html, body {
      height: 100%;
      background-color: #000000;
      color: #FFFFFF;
      overflow: hidden;
    }

    body {
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 亮度遮罩 */
    #brightness-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: black;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      padding-bottom: 24px;
      gap: 12px;
      box-sizing: border-box;
    }

    .active-page {
      display: flex;
    }

    /* 通用返回按鈕 */
    .back-btn {
      background-color: #FF9500;
      color: #FFFFFF;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 26px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: auto;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    /* 時鐘顯示 */
    .home-clock-box {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 12px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .clock-date { font-size: 22px; color: #E5E5EA; font-weight: bold; }
    .clock-time {
      font-size: 44px;
      color: #FFD700;
      font-weight: bold;
      font-family: "Courier New", Courier, monospace;
      line-height: 1.1;
    }

    /* 選單 */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      align-content: stretch;
    }

    .app-card {
      background-color: #1C1C1E;
      border: 3px solid #3A3A3C;
      border-radius: 20px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app-card:active { background-color: #2C2C2E; }
    .app-icon { font-size: 45px; }
    .app-name { font-size: 24px; font-weight: bold; color: #FFFFFF; }

    /* 設定頁面 */
    .setting-item {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-label { font-size: 26px; color: #FFD700; font-weight: bold; }
    input[type=range] { width: 100%; height: 35px; accent-color: #FFD700; }

    /* 相機頁面 */
    #camera-preview {
      width: 100%;
      flex: 1;
      min-height: 0;
      background-color: #1C1C1E;
      border-radius: 15px;
      object-fit: cover;
    }

    .cam-btn {
      background-color: #30D158;
      color: #000;
      font-size: 30px;
      font-weight: bold;
      padding: 16px;
      border-radius: 15px;
      border: none;
      width: 100%;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cam-btn-recording { background-color: #FF3B30 !important; color: #FFF !important; }

    /* 照片頁面 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .photo-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #2C2C2E;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid #48484A;
      cursor: pointer;
    }

    /* 股票頁面 */
    .stock-search-box {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .stock-input {
      flex: 1;
      min-width: 0;
      background-color: #1C1C1E;
      border: 2px solid #FFD700;
      border-radius: 12px;
      padding: 12px;
      font-size: 20px;
      color: #FFF;
      font-weight: bold;
    }

    .stock-search-btn {
      flex-shrink: 0;
      background-color: #FFD700;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .stock-list { 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      flex: 1; 
      min-height: 0; 
      overflow-y: auto; 
    }
    
    .stock-card {
      background-color: #1C1C1E;
      border: 2px solid #3A3A3C;
      border-radius: 15px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .stock-card:active { background-color: #2C2C2E; }
    .stock-card-name { font-size: 22px; font-weight: bold; color: #FFF; }
    .stock-card-code { font-size: 18px; color: #AAA; }
    .stock-card-price { font-size: 24px; font-weight: bold; text-align: right; }
    .stock-card-change { font-size: 18px; font-weight: bold; text-align: right; }

    .stock-detail-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .stock-header-info {
      background-color: #1C1C1E;
      border-radius: 15px;
      padding: 12px;
      text-align: center;
      border: 2px solid #FFD700;
      flex-shrink: 0;
    }

    .stock-detail-title { font-size: 26px; font-weight: bold; color: #FFD700; }
    .stock-detail-price { font-size: 38px; font-weight: bold; margin: 4px 0; }
    
    .data-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .data-card { background-color: #1C1C1E; border-radius: 10px; padding: 8px; text-align: center; border: 1px solid #3A3A3C; }
    .data-label { font-size: 16px; color: #AAA; }
    .data-value { font-size: 20px; font-weight: bold; margin-top: 2px; }
    
    /* 圖表容器 */
    .chart-container { 
      background-color: #1C1C1E; 
      border-radius: 15px; 
      height: 180px; 
      padding: 8px; 
      flex-shrink: 0; 
      position: relative;
      overflow: hidden;
    }
    #stockCanvas { width: 100%; height: 100%; display: block; }

    .chart-tab-group { display: flex; gap: 8px; flex-shrink: 0; }
    .chart-tab { flex: 1; background-color: #2C2C2E; color: #FFF; border: none; padding: 8px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .chart-tab.active { background-color: #FFD700; color: #000; }

    /* 計算機頁面 */
    .calc-display {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 15px;
      padding: 15px;
      font-size: 40px;
      font-weight: bold;
      text-align: right;
      color: #FFD700;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .calc-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 8px; 
      flex: 1;
      min-height: 0;
    }
    
    .calc-btn { 
      background-color: #2C2C2E; 
      color: #FFF; 
      font-size: 30px; 
      font-weight: bold; 
      border-radius: 12px; 
      border: none; 
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .calc-btn:active { opacity: 0.8; }
    .calc-op { background-color: #FF9500; color: #FFF; }
    .calc-clear { background-color: #FF3B30; color: #FFF; }
    .calc-eq { background-color: #30D158; color: #000; }

    .up { color: #FF3B30; }
    .down { color: #34C759; }

    /* Modal 彈窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .zoom-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #1C1C1E;
      border-radius: 15px;
      touch-action: none;
      position: relative;
    }

    #media-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    #enlarged-media-container {
      max-width: 100%;
      max-height: 100%;
      pointer-events: none;
    }

    .modal-btn-group { display: flex; gap: 8px; width: 100%; flex-shrink: 0; }

    .action-btn {
      flex: 1;
      padding: 14px 6px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      color: #FFF;
      cursor: pointer;
    }

    .zoom-btn { background-color: #0A84FF; }
    .delete-btn { background-color: #FF3B30; }

    .confirm-box {
      background-color: #1C1C1E;
      border: 3px solid #FFD700;
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      width: 95%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .confirm-title { font-size: 26px; color: #FFF; font-weight: bold; }
    .confirm-btn-group { display: flex; gap: 12px; }

    .confirm-btn {
      flex: 1;
      padding: 14px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    .yes-btn { background-color: #30D158; color: #000; }
    .no-btn { background-color: #8E8E93; color: #FFF; }

    .custom-select {
      font-size: 22px;
      padding: 12px;
      border-radius: 12px;
      background-color: #2C2C2E;
      color: #FFD700;
      border: 2px solid #FFD700;
      width: 100%;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 螢幕亮度調整遮罩 -->
  <div id="brightness-overlay"></div>

  <!-- 首頁 -->
  <div id="page-home" class="page active-page">
    <div class="home-clock-box">
      <div id="clock-date" class="clock-date">----年--月--日 星期-</div>
      <div id="clock-time" class="clock-time">00:00:00</div>
    </div>

    <div class="app-grid">
      <div class="app-card" onclick="navTo('page-settings')">
        <div class="app-icon">⚙️</div>
        <div class="app-name">設定</div>
      </div>
      <div class="app-card" onclick="openCameraConfig()">
        <div class="app-icon">📷</div>
        <div class="app-name">相機</div>
      </div>
      <div class="app-card" onclick="navTo('page-photos')">
        <div class="app-icon">🖼️</div>
        <div class="app-name">照片</div>
      </div>
      <div class="app-card" onclick="navTo('page-stock')">
        <div class="app-icon">📈</div>
        <div class="app-name">股票</div>
      </div>
      <div class="app-card" style="grid-column: span 2;" onclick="navTo('page-calc')">
        <div class="app-icon">🧮</div>
        <div class="app-name">計算機</div>
      </div>
    </div>
  </div>

  <!-- 1. 設定頁面 -->
  <div id="page-settings" class="page">
    <div class="setting-item">
      <div class="setting-label">螢幕亮度</div>
      <input type="range" id="brightness-slider" min="0" max="80" value="0" oninput="adjustBrightness(this.value)">
    </div>

    <div class="setting-item">
      <div class="setting-label">提示音量</div>
      <input type="range" min="0" max="100" value="80" onchange="playBeep()">
    </div>

    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <!-- 2. 相機頁面 -->
  <div id="page-camera" class="page">
    <video id="camera-preview" autoplay playsinline></video>
    <button id="cam-action-btn" class="cam-btn" onclick="handleCameraAction()">拍照</button>
    <button class="back-btn" onclick="stopCamera(); navTo('page-home');">返回首頁</button>
  </div>

  <!-- 3. 照片頁面 -->
  <div id="page-photos" class="page">
    <div id="photo-list" class="photo-grid"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <!-- 4-1. 股票列表頁面 -->
  <div id="page-stock" class="page">
    <div class="stock-search-box">
      <input type="text" id="stock-input" class="stock-input" placeholder="輸入代號 (如 2330)">
      <button class="stock-search-btn" onclick="searchStock()">搜尋</button>
    </div>
    <div class="stock-list" id="stock-list-container"></div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <!-- 4-2. 股票詳情獨立頁面 -->
  <div id="page-stock-detail" class="page">
    <div class="stock-detail-container">
      <div class="stock-header-info">
        <div id="sd-title" class="stock-detail-title">--</div>
        <div id="sd-price" class="stock-detail-price">--</div>
        <div id="sd-change" style="font-size: 22px; font-weight: bold;">--</div>
      </div>

      <div class="chart-tab-group">
        <button class="chart-tab active" onclick="switchChartTab(this, 'line')">折線圖</button>
        <button class="chart-tab" onclick="switchChartTab(this, 'kline')">K線圖</button>
      </div>

      <div class="chart-container">
        <canvas id="stockCanvas"></canvas>
      </div>

      <div class="data-grid-4">
        <div class="data-card"><div class="data-label">開盤價</div><div id="sd-open" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">昨收價</div><div id="sd-close" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">最高價</div><div id="sd-high" class="data-value up">--</div></div>
        <div class="data-card"><div class="data-label">最低價</div><div id="sd-low" class="data-value down">--</div></div>
        <div class="data-card"><div class="data-label">成交量</div><div id="sd-vol" class="data-value" style="color:#FFD700">--</div></div>
        <div class="data-card"><div class="data-label">本益比</div><div id="sd-pe" class="data-value">--</div></div>
        <div class="data-card"><div class="data-label">市值</div><div id="sd-cap" class="data-value" style="color:#5AC8FA">--</div></div>
        <div class="data-card"><div class="data-label">52週高/低</div><div id="sd-52w" class="data-value" style="font-size:16px;">--</div></div>
      </div>
    </div>

    <button class="back-btn" onclick="navTo('page-stock')">返回股票列表</button>
  </div>

  <!-- 5. 計算機頁面 -->
  <div id="page-calc" class="page">
    <div id="calc-display" class="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn calc-clear" onclick="calcClear()">清除</button>
      <button class="calc-btn calc-op" onclick="calcOp('/')">÷</button>
      <button class="calc-btn calc-op" onclick="calcOp('*')">×</button>
      <button class="calc-btn calc-op" onclick="calcOp('-')">-</button>

      <button class="calc-btn" onclick="calcNum('7')">7</button>
      <button class="calc-btn" onclick="calcNum('8')">8</button>
      <button class="calc-btn" onclick="calcNum('9')">9</button>
      <button class="calc-btn calc-op" onclick="calcOp('+')">+</button>

      <button class="calc-btn" onclick="calcNum('4')">4</button>
      <button class="calc-btn" onclick="calcNum('5')">5</button>
      <button class="calc-btn" onclick="calcNum('6')">6</button>
      <button class="calc-btn calc-eq" style="grid-row: span 2; height:100%;" onclick="calcEqual()">=</button>

      <button class="calc-btn" onclick="calcNum('1')">1</button>
      <button class="calc-btn" onclick="calcNum('2')">2</button>
      <button class="calc-btn" onclick="calcNum('3')">3</button>

      <button class="calc-btn" style="grid-column: span 2;" onclick="calcNum('0')">0</button>
      <button class="calc-btn" onclick="calcNum('.')">.</button>
    </div>
    <button class="back-btn" onclick="navTo('page-home')">返回首頁</button>
  </div>

  <!-- MODAL 彈窗區塊 -->

  <!-- 相機設定 Modal -->
  <div id="camera-config-modal" class="modal">
    <div class="confirm-box">
      <div class="confirm-title" style="color:#FFD700;">相機功能設定</div>
      <div style="text-align: left;">
        <label class="setting-label" style="font-size:20px;">1. 選擇模式：</label>
        <select id="cam-mode-select" class="custom-select" style="margin-top: 6px;">
          <option value="photo">📷 拍照模式</option>
          <option value="video">🎥 錄影模式</option>
        </select>
      </div>
      <div style="text-align: left;">
        <label class="setting-label" style="font-size:20px;">2. 選擇鏡頭：</label>
        <select id="cam-facing-select" class="custom-select" style="margin-top: 6px;">
          <option value="environment">後鏡頭 (拍風景)</option>
          <option value="user">前鏡頭 (自拍)</option>
        </select>
      </div>
      <div class="confirm-btn-group">
        <button class="confirm-btn yes-btn" onclick="applyCameraConfig()">進入相機</button>
        <button class="confirm-btn no-btn" onclick="closeCameraConfig()">取消</button>
      </div>
    </div>
  </div>

  <!-- 照片檢視 Modal -->
  <div id="photo-viewer-modal" class="modal">
    <div class="modal-content">
      <div class="zoom-container" id="zoom-container">
        <div id="media-wrapper"></div>
      </div>
      <div class="modal-btn-group">
        <button class="action-btn zoom-btn" onclick="adjustZoom(0.3)">放大 🔍+</button>
        <button class="action-btn zoom-btn" onclick="adjustZoom(-0.3)">縮小 🔍-</button>
        <button class="action-btn delete-btn" onclick="askDeleteCurrentPhoto()">刪除 🗑️</button>
      </div>
      <button class="back-btn" onclick="closePhotoViewer()">返回相簿</button>
    </div>
  </div>

  <!-- 刪除確定 Modal -->
  <div id="delete-confirm-modal" class="modal">
    <div class="confirm-box">
      <div class="confirm-title">確定要刪除這張照片嗎？</div>
      <p style="font-size: 20px; color: #AAA;">刪除後將從本地資料庫永久移除。</p>
      <div class="confirm-btn-group">
        <button class="confirm-btn" style="background-color:#FF3B30; color:#FFF;" onclick="confirmDeletePhoto()">確定刪除</button>
        <button class="confirm-btn no-btn" onclick="closeDeleteModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    // === 0. 即時時鐘邏輯 ===
    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = days[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clock-date').innerText = `${year}年${month}月${date}日 ${dayName}`;
      document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // === IndexedDB 本地資料庫處理（拍攝自動永久保存） ===
    let db = null;
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("ElderlyAppPhotoDB", 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function savePhotoToDB(type, url) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const item = { type, url, timestamp: Date.now() };
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    async function getAllPhotosFromDB() {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readonly");
        const store = tx.objectStore("photos");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.reverse());
        req.onerror = (e) => reject(e);
      });
    }

    async function deletePhotoFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("photos", "readwrite");
        const store = tx.objectStore("photos");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    // 全域狀態變數
    let albumList = [];
    let selectedPhotoIndex = -1;
    let currentZoomScale = 1;
    let translateX = 0, translateY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    // 頁面切換
    function navTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
      document.getElementById(pageId).classList.add('active-page');
      if (pageId === 'page-photos') renderAlbum();
      if (pageId === 'page-stock') renderStockList();
    }

    // === 1. 相簿檢視與控制 ===
    async function renderAlbum() {
      const grid = document.getElementById('photo-list');
      grid.innerHTML = '';
      try {
        albumList = await getAllPhotosFromDB();
      } catch (e) {
        albumList = [];
      }

      if (albumList.length === 0) {
        grid.innerHTML = `<div style="grid-column:span 2; text-align:center; color:#AAA; font-size:22px; padding-top:40px;">目前尚無照片，請使用相機拍照</div>`;
        return;
      }

      albumList.forEach((item, index) => {
        const el = document.createElement(item.type === 'image' ? 'img' : 'video');
        el.src = item.url;
        el.className = 'photo-item';
        el.onclick = () => openPhotoViewer(index);
        grid.appendChild(el);
      });
    }

    function openPhotoViewer(index) {
      selectedPhotoIndex = index;
      currentZoomScale = 1;
      translateX = 0;
      translateY = 0;
      
      const item = albumList[index];
      const wrapper = document.getElementById('media-wrapper');
      
      if (item.type === 'image') {
        wrapper.innerHTML = `<img id="enlarged-media-container" src="${item.url}">`;
      } else {
        wrapper.innerHTML = `<video id="enlarged-media-container" src="${item.url}" controls autoplay></video>`;
      }

      applyTransform();
      document.getElementById('photo-viewer-modal').style.display = 'flex';
      setupDragEvents();
    }

    function closePhotoViewer() {
      document.getElementById('photo-viewer-modal').style.display = 'none';
    }

    function adjustZoom(delta) {
      currentZoomScale += delta;
      if (currentZoomScale < 0.8) currentZoomScale = 0.8;
      if (currentZoomScale > 4.0) currentZoomScale = 4.0;
      if (currentZoomScale === 1) { translateX = 0; translateY = 0; }
      applyTransform();
    }

    function applyTransform() {
      const wrapper = document.getElementById('media-wrapper');
      if (wrapper) {
        wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoomScale})`;
      }
    }

    function setupDragEvents() {
      const container = document.getElementById('zoom-container');

      const startDrag = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX - translateX;
        startY = clientY - translateY;
      };

      const doDrag = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        translateX = clientX - startX;
        translateY = clientY - startY;
        applyTransform();
      };

      const stopDrag = () => { isDragging = false; };

      container.onmousedown = startDrag;
      container.onmousemove = doDrag;
      container.onmouseup = stopDrag;
      container.onmouseleave = stopDrag;

      container.ontouchstart = startDrag;
      container.ontouchmove = doDrag;
      container.ontouchend = stopDrag;
    }

    function askDeleteCurrentPhoto() {
      document.getElementById('delete-confirm-modal').style.display = 'flex';
    }

    function closeDeleteModal() {
      document.getElementById('delete-confirm-modal').style.display = 'none';
    }

    async function confirmDeletePhoto() {
      if (selectedPhotoIndex >= 0) {
        const target = albumList[selectedPhotoIndex];
        await deletePhotoFromDB(target.id);
        closeDeleteModal();
        closePhotoViewer();
        renderAlbum();
      }
    }

    // === 2. 相機拍攝邏輯（已移除完成提示） ===
    let videoStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentCamMode = 'photo';

    function openCameraConfig() {
      document.getElementById('camera-config-modal').style.display = 'flex';
    }

    function closeCameraConfig() {
      document.getElementById('camera-config-modal').style.display = 'none';
    }

    async function applyCameraConfig() {
      currentCamMode = document.getElementById('cam-mode-select').value;
      const facing = document.getElementById('cam-facing-select').value;
      closeCameraConfig();

      const actionBtn = document.getElementById('cam-action-btn');
      actionBtn.innerText = currentCamMode === 'video' ? '開始錄影 🎥' : '拍照 📷';
      actionBtn.className = 'cam-btn';

      navTo('page-camera');
      
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facing }, 
          audio: currentCamMode === 'video'
        });
        document.getElementById('camera-preview').srcObject = videoStream;
      } catch (e) {
        alert('無法開啟相機，請確認已授權權限');
      }
    }

    function handleCameraAction() {
      if (currentCamMode === 'photo') {
        takePhoto();
      } else {
        isRecording ? stopRecording() : startRecording();
      }
    }

    async function takePhoto() {
      const video = document.getElementById('camera-preview');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const url = canvas.toDataURL('image/png');
      await savePhotoToDB('image', url);
    }

    function startRecording() {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(videoStream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();
      isRecording = true;

      const btn = document.getElementById('cam-action-btn');
      btn.innerText = '停止錄影 ⏹️';
      btn.classList.add('cam-btn-recording');
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        const btn = document.getElementById('cam-action-btn');
        btn.innerText = '開始錄影 🎥';
        btn.classList.remove('cam-btn-recording');
      }
    }

    async function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const reader = new FileReader();
      reader.onloadend = async () => {
        await savePhotoToDB('video', reader.result);
      };
      reader.readAsDataURL(blob);
    }

    function stopCamera() {
      if (isRecording) stopRecording();
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    }

    // === 3. 設定控制 ===
    function adjustBrightness(val) {
      document.getElementById('brightness-overlay').style.opacity = val / 100;
    }

    function playBeep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.connect(ctx.destination);
      osc.frequency.value = 800;
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    // === 4. 股票邏輯 ===
    const stocksData = {
      '2330': { name: '台積電', price: 950.0, change: 15.0, open: 940.0, close: 935.0, high: 955.0, low: 938.0, vol: '4.8萬張', pe: '28.5', cap: '24.6兆', range52: '512-984' },
      '2317': { name: '鴻海', price: 185.5, change: -2.0, open: 188.0, close: 187.5, high: 189.0, low: 184.5, vol: '6.2萬張', pe: '16.2', cap: '2.57兆', range52: '98-234.5' },
      '2454': { name: '聯發科', price: 1210.0, change: 25.0, open: 1190.0, close: 1185.0, high: 1220.0, low: 1185.0, vol: '1.1萬張', pe: '22.1', cap: '1.93兆', range52: '670-1500' },
      '3711': { name: '日月光投控', price: 160.5, change: 2.5, open: 158.5, close: 158.0, high: 161.5, low: 157.5, vol: '1.2萬張', pe: '17.8', cap: '6950億', range52: '110-182' },
      '2382': { name: '廣達', price: 290.0, change: -3.0, open: 294.0, close: 293.0, high: 295.0, low: 288.0, vol: '3.5萬張', pe: '20.4', cap: '1.12兆', range52: '180-345' },
      '1303': { name: '南亞', price: 42.15, change: 0.15, open: 42.00, close: 42.00, high: 42.50, low: 41.80, vol: '1.8萬張', pe: '35.2', cap: '3340億', range52: '38.5-68.2' }
    };

    let currentStockCode = '2330';
    let currentChartType = 'line';

    function renderStockList() {
      const container = document.getElementById('stock-list-container');
      container.innerHTML = '';
      
      Object.keys(stocksData).forEach(code => {
        const item = stocksData[code];
        const isUp = item.change >= 0;
        const card = document.createElement('div');
        card.className = 'stock-card';
        card.onclick = () => goToStockDetail(code);

        card.innerHTML = `
          <div>
            <div class="stock-card-name">${item.name}</div>
            <div class="stock-card-code">${code}</div>
          </div>
          <div>
            <div class="stock-card-price ${isUp ? 'up' : 'down'}">${item.price}</div>
            <div class="stock-card-change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${item.change}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function searchStock() {
      const code = document.getElementById('stock-input').value.trim();
      if (stocksData[code]) {
        goToStockDetail(code);
      } else if (code !== '') {
        alert('查無此股票，請嘗試搜尋 2330, 2317, 2454 等');
      }
    }

    function goToStockDetail(code) {
      currentStockCode = code;
      const item = stocksData[code];
      const isUp = item.change >= 0;

      document.getElementById('sd-title').innerText = `${item.name} (${code})`;
      document.getElementById('sd-price').innerText = item.price;
      document.getElementById('sd-price').className = `stock-detail-price ${isUp ? 'up' : 'down'}`;
      document.getElementById('sd-change').innerText = `${isUp ? '▲' : '▼'} ${isUp ? '+' : ''}${item.change}`;
      document.getElementById('sd-change').className = isUp ? 'up' : 'down';

      document.getElementById('sd-open').innerText = item.open;
      document.getElementById('sd-close').innerText = item.close;
      document.getElementById('sd-high').innerText = item.high;
      document.getElementById('sd-low').innerText = item.low;
      document.getElementById('sd-vol').innerText = item.vol;
      document.getElementById('sd-pe').innerText = item.pe;
      document.getElementById('sd-cap').innerText = item.cap;
      document.getElementById('sd-52w').innerText = item.range52;

      navTo('page-stock-detail');
      setTimeout(() => drawStockChart(), 60);
    }

    function switchChartTab(btn, type) {
      document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      currentChartType = type;
      drawStockChart();
    }

    function drawStockChart() {
      const canvas = document.getElementById('stockCanvas');
      const container = canvas.parentElement;
      const ctx = canvas.getContext('2d');
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      canvas.width = width * 2;
      canvas.height = height * 2;
      ctx.scale(2, 2);

      const item = stocksData[currentStockCode];
      const isUp = item.change >= 0;
      const color = isUp ? '#FF3B30' : '#34C759';

      ctx.clearRect(0, 0, width, height);

      const pX = 25;
      const pY = 20;
      const drawW = width - pX * 2;
      const drawH = height - pY * 2;

      if (currentChartType === 'line') {
        const points = [item.open, item.low, item.high, item.price];
        const minVal = Math.min(...points);
        const maxVal = Math.max(...points);
        const valRange = (maxVal - minVal) || 1;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;

        points.forEach((pt, i) => {
          const x = pX + (i * drawW) / (points.length - 1);
          const y = height - pY - ((pt - minVal) / valRange) * drawH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        points.forEach((pt, i) => {
          const x = pX + (i * drawW) / (points.length - 1);
          const y = height - pY - ((pt - minVal) / valRange) * drawH;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });

      } else {
        const candles = [
          { o: item.open, h: item.open + 4, l: item.open - 3, c: item.open + 1 },
          { o: item.open + 1, h: item.high, l: item.low, c: item.price }
        ];

        candles.forEach((c, i) => {
          const x = pX + (i + 1) * (drawW / 3);
          const isCandleUp = c.c >= c.o;
          const cColor = isCandleUp ? '#FF3B30' : '#34C759';

          ctx.strokeStyle = cColor;
          ctx.fillStyle = cColor;
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.moveTo(x, pY);
          ctx.lineTo(x, height - pY);
          ctx.stroke();

          const boxH = Math.max(Math.abs(c.c - c.o) * 5, 20);
          ctx.fillRect(x - 14, (height / 2) - (boxH / 2), 28, boxH);
        });
      }
    }

    // === 5. 計算機邏輯 ===
    let calcExpr = '';
    function calcNum(num) {
      calcExpr += num;
      document.getElementById('calc-display').innerText = calcExpr;
    }

    function calcOp(op) {
      if (calcExpr !== '' && !['+','-','*','/'].includes(calcExpr.slice(-1))) {
        calcExpr += op;
        document.getElementById('calc-display').innerText = calcExpr;
      }
    }

    function calcClear() {
      calcExpr = '';
      document.getElementById('calc-display').innerText = '0';
    }

    function calcEqual() {
      try {
        if (calcExpr) {
          const res = eval(calcExpr);
          calcExpr = String(res);
          document.getElementById('calc-display').innerText = calcExpr;
        }
      } catch (e) {
        document.getElementById('calc-display').innerText = '錯誤';
        calcExpr = '';
      }
    }

    // 初始化開啟 DB
    initDB();
  </script>
</body>
